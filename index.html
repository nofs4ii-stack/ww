<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج إعلان جديد</title>
    <!-- مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📝 تقديم إعلان جديد</h2>
    
    <label>عنوان الإعلان:</label>
    <input type="text" id="title" placeholder="مثال: سيارة للبيع..." required>

    <label>التفاصيل:</label>
    <textarea id="details" rows="4" placeholder="اكتب تفاصيل إعلانك هنا..." required></textarea>

    <label>السعر:</label>
    <input type="text" id="price" placeholder="مثال: 1500 ريال" required>

    <label>رقم التواصل:</label>
    <input type="tel" id="contact" placeholder="رقم الجوال أو يوزر تليجرام" required>

    <button onclick="sendData()">إرسال الطلب للمشرفين</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // لفتح النموذج بملء الشاشة

        function sendData() {
            let title = document.getElementById("title").value;
            let details = document.getElementById("details").value;
            let price = document.getElementById("price").value;
            let contact = document.getElementById("contact").value;

            if (!title || !details || !price || !contact) {
                tg.showAlert("يرجى تعبئة جميع الحقول!");
                return;
            }

            // تجميع البيانات لإرسالها للبوت
            let data = {
                title: title,
                details: details,
                price: price,
                contact: contact
            };

            // إرسال البيانات وإغلاق النافذة
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
